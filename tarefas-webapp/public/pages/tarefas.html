<div class="card mb-4">
    <div class="card-header">Tarefas/<b>Pesquisar</b></div>
    <div class="card-body">
        <form id="frmPesquisarTarefas">
            <div class="row">
                <div class="col-12">
                    <input type="text" id="guidId" class="form-control" placeholder="Pesquisar por código." required />
                </div>                
            </div>
            <div class="row">
                <div class="col-12 d-flex justify-content-end mt-3">
                    <a class="btn btn-outline-secondary" href="/tarefas" data-link>Pesquisar Todos</a>&nbsp;
                    <button type="button" id="btnPesquisar" class="btn btn-outline-primary">Pesquisar</button>
                </div>
            </div>
        </form>
    </div>
</div>

<div class="card">
    <div class="card-header">Tarefas/<b>Registros</b></div>
    <div class="card-body">
        <div class="d-flex justify-content-end mb-4">
            <button class="btn btn-outline-primary" id="btnRenderizarCriar">Criar Tarefa</button>
        </div>
        <div class="table-responsive" id="tblTarefas">
            <table class="table table-striped table-bordered align-middle">
                <thead>
                    <tr>
                        <th scope="col" style="min-width: 400px; white-space: nowrap !important;">Código</th>
                        <th scope="col" style="min-width: 200px;">Data Cadastro</th>
                        <th scope="col" style="min-width: 100px;">Status</th>
                        <th scope="col" style="min-width: 400px;">Nome</th>
                        <th scope="col" style="min-width: 200px;">Valor</th>
                        <th scope="col" style="min-width: 100px;">Ações</th>
                    </tr>
                </thead>
                <tbody id="registros"></tbody>
            </table>
        </div>
    </div>
</div>

 <div id="modalApp"></div>
